name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          set -o pipefail
          {
            echo "== env"; java -version; echo "ANDROID_HOME=$ANDROID_HOME"; which gradle || true
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            echo "== wrapper"; gradle wrapper --gradle-version 8.14.3 --no-daemon
            echo "== build"; ./gradlew assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee build.log

      - name: Name APK with build tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/FullScreenGesture-v1.1.0-b${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FullScreenGesture-v1.1.0-b${{ github.run_number }}
          path: out/*.apk

      - name: Publish APK to apk branch
        run: |
          cp out/*.apk /tmp/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf . -q
          cp /tmp/FullScreenGesture-*.apk .
          git add FullScreenGesture-*.apk
          git commit -q -m "APK build ${GITHUB_RUN_NUMBER}"
          git push -f origin apk

      - name: Publish error log to buildlog branch
        if: failure()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no build.log (failed before gradle step)" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan buildlog
          git rm -rf . -q 2>/dev/null || true
          cp /tmp/build.log .
          git add build.log
          git commit -q -m "Build log run ${GITHUB_RUN_NUMBER}"
          git push -f origin buildlog
